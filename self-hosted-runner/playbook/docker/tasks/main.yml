- name: Dockerに必要なパッケージをインストール
  apt:
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
    - curl
    - ca-certificates

- name: 作成 /etc/apt/keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Docker GPGキーをダウンロード
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: 旧Docker APTリポジトリを削除
  apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ansible_distribution_release}} stable
    state: absent

- name: Docker APT sourceを追加
  copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf', 'ppc64le': 'ppc64el', 's390x': 's390x'}[ansible_architecture] | default(ansible_architecture) }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Dockerに必要なパッケージをインストール
  apt:
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

- name: ubuntuユーザーをdockerグループに追加
  user:
    name: ubuntu
    groups: docker
    append: yes


